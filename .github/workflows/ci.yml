name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # dev-only (build): @resvg/resvg-js — rasterizacja mini-map (ADR 0027 v3);
      # silnik (src/codex) pozostaje zero-dependency (ADR 0002)
      - name: Zależności dev (build)
        run: npm ci
      - name: Testy integralności bazy (pełny pakiet)
        run: node tools/run-tests.mjs all
      - name: Build artefaktu
        run: node tools/build.mjs
      - name: Publikacja pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: mtg-lore-codex
          path: dist/mtg-lore-codex.html
