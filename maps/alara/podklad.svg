<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <!-- T4: rekonstrukcja kanoniczna; proweniencja w map.json -->
  <rect width="1600" height="1600" fill="#ececec"/>
  <!-- regiony: cykl many wokół Maelstromu (Bant-Esper-Grixis-Jund-Naya) -->
  <g stroke="none">
    <path d="M 800,800 L 388.5,233.7 A 700 700 0 0 1 1211.5,233.7 Z" fill="#f7f7f7"/>
    <path d="M 800,800 L 1211.5,233.7 A 700 700 0 0 1 1465.8,1016.3 Z" fill="#ffffff"/>
    <path d="M 800,800 L 1465.8,1016.3 A 700 700 0 0 1 800,1500 Z" fill="#f7f7f7"/>
    <path d="M 800,800 L 800,1500 A 700 700 0 0 1 134.2,1016.3 Z" fill="#ffffff"/>
    <path d="M 800,800 L 134.2,1016.3 A 700 700 0 0 1 388.5,233.7 Z" fill="#f7f7f7"/>
  </g>
  <!-- szwy regionów (granice dawnych shardów) -->
  <g stroke="#5f5f5f" stroke-width="4">
    <line x1="946.9" y1="597.7" x2="1211.5" y2="233.7" stroke="#5f5f5f" stroke-width="4"/>
    <line x1="1037.8" y1="877.3" x2="1465.8" y2="1016.3" stroke="#5f5f5f" stroke-width="4"/>
    <line x1="800" y1="1050" x2="800" y2="1500" stroke="#5f5f5f" stroke-width="4"/>
    <line x1="562.2" y1="877.3" x2="134.2" y2="1016.3" stroke="#5f5f5f" stroke-width="4"/>
    <line x1="653.1" y1="597.7" x2="388.5" y2="233.7" stroke="#5f5f5f" stroke-width="4"/>
  </g>
  <!-- obeliski przy szwach (stabilizowały shardy) -->
  <g fill="#6b6b6b" stroke="none">
    <path d="M 1071.3,435.8 L 1071.3,403.8 L 1076.3,393.8 L 1081.3,403.8 L 1081.3,435.8 Z"/>
    <path d="M 1242,961.2 L 1242,929.2 L 1247,919.2 L 1252,929.2 L 1252,961.2 Z"/>
    <path d="M 795,1286 L 795,1254 L 800,1244 L 805,1254 L 805,1286 Z"/>
    <path d="M 348,961.2 L 348,929.2 L 353,919.2 L 358,929.2 L 358,961.2 Z"/>
    <path d="M 518.7,435.8 L 518.7,403.8 L 523.7,393.8 L 528.7,403.8 L 528.7,435.8 Z"/>
  </g>
  <!-- Maelstrom: wir w punkcie złączenia pięciu shardów -->
  <circle cx="800" cy="800" r="250" fill="#dedede" stroke="#1c1c1c" stroke-width="4"/>
  <g fill="none" stroke="#6b6b6b" stroke-width="3" stroke-dasharray="16 12">
    <circle cx="800" cy="800" r="210" fill="none" stroke="#6b6b6b" stroke-width="3" stroke-dasharray="16 12"/>
    <circle cx="800" cy="800" r="150" fill="none" stroke="#6b6b6b" stroke-width="3" stroke-dasharray="16 12"/>
    <circle cx="800" cy="800" r="90" fill="none" stroke="#6b6b6b" stroke-width="3" stroke-dasharray="16 12"/>
  </g>
  <!-- obrys planu -->
  <circle cx="800" cy="800" r="700" fill="none" stroke="#1c1c1c" stroke-width="6"/>
  <!-- miejsca kanoniczne (pozycje reprezentatywne w regionach) -->
  <g fill="#1c1c1c" stroke="none">
    <circle cx="655.1" cy="259.1" r="5"/>
    <circle cx="944.9" cy="259.1" r="5"/>
    <circle cx="800" cy="180" r="5"/>
    <circle cx="1229" cy="1160" r="5"/>
    <circle cx="267.4" cy="627" r="5"/>
  </g>
  <!-- etykiety -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#6b1f2e" stroke="#f7f7f7" stroke-width="6" paint-order="stroke" text-anchor="middle">
    <text x="800" y="346" font-size="48">BANT</text>
    <text x="1247" y="671" font-size="48">ESPER</text>
    <text x="1076" y="1196" font-size="48">GRIXIS</text>
    <text x="524" y="1196" font-size="48">JUND</text>
    <text x="353" y="671" font-size="48">NAYA</text>
    <text x="800" y="762" font-size="40" stroke="#dedede">MAELSTROM</text>
    <text x="800" y="160" font-size="22">Akrasa</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#6b1f2e" stroke="#f7f7f7" stroke-width="6" paint-order="stroke" font-size="22">
    <text x="638" y="266" text-anchor="end">Valeron</text>
    <text x="960" y="266" text-anchor="start">Jhess</text>
    <text x="1245" y="1168" text-anchor="start">Sedraxis</text>
    <text x="252" y="634" text-anchor="end">Antali</text>
