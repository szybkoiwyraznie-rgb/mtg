  <path d="M 250,1000 C 320,950 420,960 490,990 C 570,960 660,980 700,1040 C 760,1070 780,1150 740,1210 C 760,1270 690,1310 610,1295 C 540,1320 450,1300 400,1255 C 320,1270 260,1220 265,1150 C 235,1100 225,1040 250,1000 Z"
    fill="#e8dbb8" stroke="#a89468" stroke-width="3.5"/>

  <!-- wyspy Ondu: Jwar, Agadeem, Beyeen -->
  <g fill="#e8dbb8" stroke="#a89468" stroke-width="3">
    <circle cx="125" cy="1015" r="20"/>
    <circle cx="175" cy="1070" r="14"/>
    <path d="M 200,1220 C 205,1170 260,1150 295,1180 C 320,1210 310,1270 270,1285 C 230,1300 195,1265 200,1220 Z"/>
    <circle cx="105" cy="1200" r="15"/>
  </g>

  <!-- Malakir -->
  <circle cx="1215" cy="1255" r="7" fill="#4a3a28"/>

  <!-- Murasa (położenie przybliżone — linia przerywana) -->
  <path d="M 860,1160 C 890,1110 970,1095 1030,1115 C 1090,1100 1140,1140 1145,1200 C 1160,1260 1120,1310 1060,1320 C 1010,1350 930,1345 890,1310 C 850,1280 840,1210 860,1160 Z"
