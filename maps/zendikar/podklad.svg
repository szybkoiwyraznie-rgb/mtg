  <!-- tama Sea Gate -->
  <path d="M 735,758 L 778,736" stroke="#7b2d26" stroke-width="8" stroke-linecap="round"/>

  <!-- Emeria — ruiny w niebie (dryfujący hedron) -->
  <path d="M 880,268 L 893,285 L 880,302 L 867,285 Z" fill="none" stroke="#4a3a28" stroke-width="2.5"/>
  <path d="M 915,252 L 924,264 L 915,276 L 906,264 Z" fill="none" stroke="#4a3a28" stroke-width="2" opacity="0.7"/>

