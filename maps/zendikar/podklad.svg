    <path transform="translate(1900,125)" d="M -30,0 q 15,-12 30,0 q 15,12 30,0 M -22,14 q 12,-10 24,0 M -12,28 q 8,-7 16,0"/>
  </g>

  <!-- wiry Roil na otwartym oceanie -->
  <g stroke="#7f9a90" stroke-width="3" fill="none" opacity="0.45" stroke-linecap="round">
