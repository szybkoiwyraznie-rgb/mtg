    <path transform="translate(1120,260)" d="M -70,0 A 70 70 0 1 1 70,0 A 55 55 0 1 0 -40,0 A 26 26 0 1 1 12,0"/>
    <path transform="translate(980,1010)" d="M -70,0 A 70 70 0 1 1 70,0 A 55 55 0 1 0 -40,0 A 26 26 0 1 1 12,0"/>
  </g>

  <!-- wolno dryfujące hedrony -->
  <g stroke="#6b5d52" stroke-width="2.5" fill="none" opacity="0.65">
    <path transform="translate(350,300)" d="M 0,-14 L 10,0 L 0,14 L -10,0 Z"/>
    <path transform="translate(1180,345)" d="M 0,-11 L 8,0 L 0,11 L -8,0 Z"/>
    <path transform="translate(420,925)" d="M 0,-12 L 9,0 L 0,12 L -9,0 Z"/>
