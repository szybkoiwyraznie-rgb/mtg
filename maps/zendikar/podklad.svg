    L 1400,235 L 1455,258 L 1500,175 L 1565,245 L 1635,190 L 1705,255 L 1775,205 L 1838,285 L 1908,340
    L 1872,425 L 1918,485 L 1842,535 L 1862,605 L 1775,628
    L 1690,610 L 1655,645 L 1635,675
    C 1650,695 1710,695 1750,760
    C 1775,790 1770,820 1762,855
    L 1700,905
    C 1660,930 1600,940 1550,950
    L 1470,965 L 1400,950 L 1360,955
    L 1345,985 L 1330,1015
    L 1385,1045 L 1470,1080 L 1530,1120
    C 1560,1150 1580,1180 1585,1210
    L 1560,1270
    C 1520,1320 1470,1340 1400,1352
    L 1330,1352 L 1240,1338 L 1170,1300
    C 1120,1270 1085,1230 1080,1180
    L 1085,1090
    C 1090,1055 1115,1040 1145,1040
    L 1220,1012 L 1275,988 L 1290,955
    C 1275,940 1250,935 1225,930
    L 1185,895
    C 1160,860 1150,830 1162,790
    L 1172,745
    C 1190,715 1220,700 1265,690
    L 1330,688 L 1400,705 L 1450,690 L 1500,700 L 1560,672
    L 1590,645 L 1600,618
    C 1570,605 1530,598 1490,608
    L 1420,600 L 1385,575
    C 1360,530 1355,480 1370,435
    C 1362,400 1350,370 1355,330 Z"
    fill="#e8dbb8" stroke="#a89468" stroke-width="3.5"/>

  <!-- wulkanicne szczyty Akoum -->
  <g fill="#9c6b5e" opacity="0.85">
    <path d="M 1465,395 L 1497,340 L 1529,395 Z"/>
    <path d="M 1682,495 L 1712,442 L 1742,495 Z"/>
  </g>

  <!-- Oko Ugina (hedron) -->
  <path d="M 1610,522 L 1624,540 L 1610,558 L 1596,540 Z" fill="#e8dbb8" stroke="#4a3a28" stroke-width="2.5"/>

  <!-- Tazeem -->
  <path d="M 380,420 C 430,360 540,350 620,380 C 700,350 800,370 850,420 C 910,450 940,520 930,590 C 960,650 920,720 870,740 C 890,800 840,850 780,840 C 720,880 630,870 580,830 C 500,850 420,820 400,760 C 350,720 340,650 370,600 C 340,550 350,470 380,420 Z"
    fill="#e8dbb8" stroke="#a89468" stroke-width="3.5"/>

