  <path d="M 925,1175 q 40 -8 85 0 M 950,1265 q 40 8 80 0" stroke="#a89468" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- etykiety kontynentów -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#4a3a28" text-anchor="middle">
    <text x="850" y="150" font-size="44" letter-spacing="4">Sejiri</text>
    <text x="850" y="185" font-size="22" font-style="italic" fill="#6b5d52">(polarny lód)</text>

    <text x="1640" y="395" font-size="46" letter-spacing="4">Akoum</text>
    <text x="1640" y="430" font-size="22" font-style="italic" fill="#6b5d52">(wulkaniczny)</text>
    <text x="1610" y="588" font-size="22" fill="#4a3a28">Oko Ugina</text>

    <text x="1430" y="795" font-size="42" letter-spacing="3">Bala Ged</text>
    <text x="1430" y="830" font-size="22" font-style="italic" fill="#6b5d52">(bagna i dżungla)</text>

    <text x="1300" y="1165" font-size="42" letter-spacing="3">Guul Draz</text>
    <text x="1300" y="1200" font-size="22" font-style="italic" fill="#6b5d52">(kraina wampirów)</text>
    <text x="1215" y="1292" font-size="24">Malakir</text>

    <text x="610" y="450" font-size="46" letter-spacing="4">Tazeem</text>
    <text x="625" y="672" font-size="26" font-style="italic" fill="#3d5a6e">Halimar</text>
    <text x="812" y="788" font-size="24">Sea Gate</text>
    <text x="880" y="330" font-size="24">Emeria</text>
    <text x="505" y="812" font-size="22" font-style="italic" fill="#6b5d52">Las Oran-Rief</text>

    <text x="490" y="1120" font-size="44" letter-spacing="4">Ondu</text>
    <text x="130" y="1108" font-size="22">Wyspy Jwar</text>
    <text x="250" y="1318" font-size="22">Agadeem</text>
    <text x="105" y="1248" font-size="22">Beyeen</text>

    <text x="1000" y="1215" font-size="42" letter-spacing="3">Murasa</text>
    <text x="1000" y="1248" font-size="20" font-style="italic" fill="#6b5d52">(położenie przybliżone)</text>
  </g>

  <!-- róża wiatrów -->
  <g stroke="#6b5d52" fill="none" opacity="0.8">
    <circle cx="150" cy="560" r="52" stroke-width="2"/>
    <path d="M 150,508 L 150,612 M 98,560 L 202,560" stroke-width="2"/>
    <path d="M 150,508 L 160,560 L 150,612 L 140,560 Z" fill="#6b5d52" stroke="none" opacity="0.5"/>
  </g>
  <text x="150" y="498" font-family="Georgia, serif" font-size="26" fill="#4a3a28" text-anchor="middle">N</text>

  <!-- ramka -->
  <rect x="14" y="14" width="1972" height="1372" fill="none" stroke="#8a7a5c" stroke-width="3"/>
  <rect x="30" y="30" width="1940" height="1340" fill="none" stroke="#8a7a5c" stroke-width="1.5" opacity="0.6"/>

  <!-- podpis kartograficzny -->
  <text x="1968" y="1362" font-family="Georgia, serif" font-size="21" font-style="italic" fill="#6b5d52" text-anchor="end">Rekonstrukcja układu kontynentów wg kanonu tekstowego — położenie Murasy przybliżone</text>
</svg>
