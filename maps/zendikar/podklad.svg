    <path transform="translate(1050,185)" d="M -30,0 q 15,-12 30,0 q 15,12 30,0 M -22,14 q 12,-10 24,0 M -12,28 q 8,-7 16,0"/>
    <path transform="translate(1265,315)" d="M -30,0 q 15,-12 30,0 q 15,12 30,0 M -22,14 q 12,-10 24,0 M -12,28 q 8,-7 16,0"/>
